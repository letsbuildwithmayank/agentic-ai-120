[project]
name = "agentic-ai-120"
version = "0.1.0"
description = "120 days of learning and building AI agents, in public."
readme = "README.md"
authors = [
    { name = "Mayank", email = "letsbuildwithmayank@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "google-genai>=2.34.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "python-dotenv>=1.2.4",
    "tiktoken>=0.14.0",
    "tokenizers>=0.23.3",
]

[project.scripts]
agentic-ai-120 = "agentic_ai_120:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pre-commit>=4.7.0",
    "ruff>=0.17.3",
]

[tool.ruff.lint]
# zip(ids, ids[1:]) is kept on purpose to match Karpathy's tokenizer code
ignore = ["RUF007"]